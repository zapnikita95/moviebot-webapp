<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Movie Planner — Mini App</title>
  <meta http-equiv="refresh" content="0; url=https://web-production-3921c.up.railway.app/miniapp" />
  <link rel="canonical" href="https://web-production-3921c.up.railway.app/miniapp" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #0f1115);
      color: var(--tg-theme-text-color, #f5f5f7);
      text-align: center;
      padding: 24px;
    }
    .box { max-width: 320px; }
    .logo { font-size: 48px; margin-bottom: 12px; }
    h1 { font-size: 18px; margin: 0 0 8px; font-weight: 600; }
    p { color: var(--tg-theme-hint-color, #8a8f99); font-size: 14px; margin: 0 0 20px; }
    a {
      display: inline-block;
      padding: 11px 22px;
      background: var(--tg-theme-button-color, #ffb547);
      color: var(--tg-theme-button-text-color, #0f1115);
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }
    .spinner {
      width: 24px; height: 24px;
      margin: 0 auto 16px;
      border: 3px solid rgba(255, 181, 71, 0.2);
      border-top-color: #ffb547;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">🎬</div>
    <div class="spinner"></div>
    <h1>Переносим в новый дом</h1>
    <p>Movie Planner Mini App теперь живёт на сервере бота. Если переадресация не сработала автоматически — нажмите кнопку ниже.</p>
    <a href="https://web-production-3921c.up.railway.app/miniapp">Открыть Mini App</a>
  </div>
  <script>
    // Двойная страховка: после 300 мс форсим редирект на новый домен,
    // сохраняя startapp/параметры запуска, если они были.
    (function () {
      try { if (window.Telegram && Telegram.WebApp) { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } } catch (e) {}
      var target = "https://web-production-3921c.up.railway.app/miniapp";
      var search = location.search || "";
      var hash = location.hash || "";
      setTimeout(function () { location.replace(target + search + hash); }, 300);
    })();
  </script>
</body>
</html>
